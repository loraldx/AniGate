name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      # scripts/verify.sh is the single source of truth for the quality gate:
      # mod verify, tests, vet, race, three builds, tool-surface assertions,
      # and the HTTP MCP smoke test. Keep the assertions there, not here.
      - name: Run verify
        run: ./scripts/verify.sh
